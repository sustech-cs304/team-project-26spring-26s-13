name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # We will use PostgreSQL service in GitHub Actions to test against a real DB
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: spa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run Format Check (Black)
      run: |
        black --check .
        
    - name: Run Linter (Flake8)
      run: |
        flake8 .
        
    - name: Run Backend Tests
      env:
        # Override the Postgres DSN to use the service above during tests if needed
        # Or let tests use sqlite+aiosqlite if they are set up to do so
        # POSTGRES_DSN: postgresql+asyncpg://postgres:password@localhost:5432/spa_test
        # We can also mock environment variables required by config.py
        SPA_API_BASE_URL: http://127.0.0.1:8000
        SPA_JWT_SECRET: supersecret_test_key
      run: |
        pytest tests/ --cov=backend --cov-report=xml
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
