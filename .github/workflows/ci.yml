name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: spa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install lizard

    # ── Lint ──────────────────────────────────────────────────
    - name: Run Format Check (Black)
      run: black --check .

    - name: Run Linter (Flake8)
      run: |
        flake8 . > reports/flake8.log 2>&1 || true
        flake8 .

    # ── Test ──────────────────────────────────────────────────
    - name: Create reports directory
      run: mkdir -p reports

    - name: Run Tests
      run: |
        python -m pytest tests/ \
          --cov=backend \
          --cov-report=xml:reports/coverage.xml \
          --cov-report=html:reports/coverage-html \
          --junitxml=reports/junit.xml \
          -v

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: reports/
        retention-days: 30

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: reports/coverage.xml
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    # ── Metrics & Documentation ───────────────────────────────
    - name: Generate Metrics Report
      run: python scripts/generate_metrics.py

    - name: Upload Metrics Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: metrics-report
        path: reports/metrics.*

    # ── Docker Build & Push ───────────────────────────────────
    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_IMAGE_NAME || 'sustechcs304/student-productivity-agent' }}:latest
          ${{ secrets.DOCKER_IMAGE_NAME || 'sustechcs304/student-productivity-agent' }}:${{ github.sha }}
